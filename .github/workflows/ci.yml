name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nook
          POSTGRES_PASSWORD: nook
          POSTGRES_DB: nook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nook -d nook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.5"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app cli.py worker bot
      - name: Run Alembic migrations
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      - name: Prettier check
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Vitest
        run: pnpm run test
      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_BASE_URL: http://localhost:8080
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-e2e-password-123
    steps:
      - uses: actions/checkout@v4
      - name: Write .env for the compose stack
        run: |
          cat > .env <<EOF
          APP_NAME=Nook
          PUBLIC_URL=${E2E_BASE_URL}
          SECRET_KEY=ci-secret-key-0123456789abcdef0123456789
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_BOT_USERNAME=
          BOT_MODE=polling
          ADMIN_USERNAME=${E2E_ADMIN_USERNAME}
          ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD}
          MAX_UPLOAD_MB=25
          MAX_IMPORT_MB=500
          WEB_PORT=8080
          EOF
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the stack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${E2E_BASE_URL}/" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: frontend
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Docker compose logs
        if: failure()
        run: docker compose logs
