name: nook

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./backend
    restart: unless-stopped
    command: python worker/main.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    volumes:
      - attachments:/data/attachments
    depends_on:
      api:
        condition: service_healthy

  bot:
    build: ./backend
    restart: unless-stopped
    command: python bot/main.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-Nook}
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this image's musl libc resolves "localhost" to ::1
      # first, and nginx here only binds 0.0.0.0:80 — wget would get "connection
      # refused" over IPv6 and never fall back, failing the healthcheck even though
      # the app is up and serving fine over IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Named explicitly so the project keeps using its existing data volumes
  # (created back when this repo was still called "taskian") regardless of
  # what the checkout directory is named.
  pgdata:
    name: taskian_pgdata
  attachments:
    name: taskian_attachments
