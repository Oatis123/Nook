name: nook

# Every service: bounded json-file logs, so a chatty container can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: ${API_MEM_LIMIT:-1g}
    # `exec` so uvicorn replaces the shell and receives SIGTERM directly (graceful
    # shutdown). --proxy-headers takes the client IP from nginx's X-Forwarded-For —
    # trusting any sender is safe only because this port is never published: nginx
    # (which overwrites the header with the real peer address) is the only client.
    command: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips '*'"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./backend
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    # Time to finish the current reminder/import step after SIGTERM before SIGKILL.
    stop_grace_period: 30s
    command: python worker/main.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    volumes:
      - attachments:/data/attachments
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # worker/main.py touches this file after every reminder tick (every 30s).
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/nook-worker.heartbeat", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bot:
    build: ./backend
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: ${BOT_MEM_LIMIT:-256m}
    command: python bot/main.py
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/nook-bot.heartbeat", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-Nook}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-128m}
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-500}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this image's musl libc resolves "localhost" to ::1
      # first, and nginx here only binds 0.0.0.0:80 — wget would get "connection
      # refused" over IPv6 and never fall back, failing the healthcheck even though
      # the app is up and serving fine over IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Named explicitly so the project keeps using its existing data volumes
  # (created back when this repo was still called "taskian") regardless of
  # what the checkout directory is named.
  pgdata:
    name: taskian_pgdata
  attachments:
    name: taskian_attachments
